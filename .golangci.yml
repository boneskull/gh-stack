run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - gofmt
    - goimports
    - misspell
    - gosec

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  govet:
    enable:
      - shadow
  gosec:
    excludes:
      - G204 # Subprocess launched with variable - we intentionally shell out to git/gh

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
