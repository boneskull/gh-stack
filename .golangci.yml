version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    # gosec disabled - false positives for CLI tools that shell out to git
  exclusions:
    rules:
      # Test files can have unchecked errors - tests use t.Fatal patterns
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  govet:
    enable:
      - shadow

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
