version: "2"

run:
  timeout: 5m

linters:
  enable:
    - copyloopvar
    - dupword
    - errcheck
    - errname
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - intrange
    - misspell
    - modernize
    - nilerr
    - perfsprint
    - staticcheck
    - unconvert
    - unused
    # gosec disabled - false positives for CLI tools that shell out to git
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable:
        - shadow
  exclusions:
    rules:
      # Test files can have unchecked errors - tests use t.Fatal patterns
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
