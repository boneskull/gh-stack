name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # only run when PR is from this repository (fork PRs don't receive secrets)
    if: |
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Harden-Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # Pinned to v1 for supply-chain safety
        uses: anthropics/claude-code-action@f2accb9a171bd71f4b5c93bcea23876aa5244edb
        with:
          allowed_bots: 'renovate[bot]'
          claude_args: |
            --max-turns 10
          track_progress: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Uses vendored code-review skill from .claude/commands/code-review.md
          prompt: '/project:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'

